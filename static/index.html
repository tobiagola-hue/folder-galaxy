<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Folder Galaxy - a live 3D constellation of your folders and files">
<meta name="theme-color" content="#05060d">
<title>Folder Galaxy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff3bf'/%3E%3Ccircle cx='6' cy='8' r='3' fill='%234dabf7'/%3E%3Ccircle cx='26' cy='9' r='3' fill='%23ff6b6b'/%3E%3Ccircle cx='24' cy='26' r='3' fill='%2369db7c'/%3E%3Ccircle cx='7' cy='24' r='2' fill='%23da77f2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #05060d;
    --panel: rgba(14, 17, 30, 0.78);
    --panel-border: rgba(140, 160, 220, 0.16);
    --text: #e7eaf3;
    --muted: #8a93ab;
    --accent: #ffe08a;
    --live: #51cf66;
    --down: #ff6b6b;
    --radius: 12px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); }
  body {
    background:
      radial-gradient(1px 1px at 12% 18%, #ffffff55, transparent),
      radial-gradient(1px 1px at 72% 34%, #ffffff40, transparent),
      radial-gradient(1px 1px at 38% 82%, #ffffff40, transparent),
      radial-gradient(1px 1px at 88% 76%, #ffffff55, transparent),
      radial-gradient(1.5px 1.5px at 55% 8%, #ffffff50, transparent),
      radial-gradient(1px 1px at 22% 58%, #ffffff35, transparent),
      radial-gradient(ellipse at 50% 45%, #0d1230 0%, var(--bg) 70%);
  }
  #graph { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap; transform: translate(-50%, -100%);
    font-size: 11px; color: #dfe4f2; text-shadow: 0 0 4px #000, 0 0 2px #000; will-change: transform;
  }
  .lbl.root { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .lbl.proj { font-size: 13px; font-weight: 650; }
  .lbl.proj small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .lbl.hit { color: #fff; background: rgba(255, 224, 138, .18); padding: 0 4px; border-radius: 4px; }
  .lbl.sel { color: #fff; font-weight: 600; background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 5px; }

  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  #hud { top: 14px; left: 14px; width: 300px; max-height: calc(100vh - 28px); overflow: auto; padding: 12px 14px; }
  #hud h1 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  #hud h1 .dot-root { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #hudToggle { display: none; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 2px; }
  #live { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #live i { width: 8px; height: 8px; border-radius: 50%; background: var(--down); }
  #live.on i { background: var(--live); box-shadow: 0 0 8px var(--live); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #pathForm { display: flex; gap: 6px; margin-top: 10px; }
  #pathInput {
    flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: rgba(0,0,0,.35); color: var(--text); font: 12px var(--mono); outline: none;
  }
  #pathInput:focus { border-color: rgba(255,224,138,.5); }
  #pathForm .btn { padding: 5px 9px; }
  #crumbs { margin-top: 6px; font: 11.5px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px; }
  #crumbs button { all: unset; cursor: pointer; color: #b9c2dc; padding: 0 2px; border-radius: 4px; }
  #crumbs button:hover { background: rgba(255,255,255,.08); color: #fff; }
  #crumbs .cur { color: var(--accent); }
  #crumbs .off { opacity: .5; }
  #pathErr { display: none; margin-top: 6px; padding: 5px 8px; border-radius: 8px; background: rgba(255,107,107,.12); color: #ffa8a8; font-size: 12px; }
  #stats { margin-top: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--text); font-weight: 600; }
  #warn { display: none; margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: rgba(255,169,77,.12); color: #ffc078; font-size: 12px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; user-select: none; }
  .list { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; }
  button.row { all: unset; display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  button.row:hover, button.row:focus-visible { background: rgba(255,255,255,.07); }
  .row .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ct { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

  #tools { top: 14px; right: 14px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 310px); }
  #search {
    width: 210px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: rgba(0,0,0,.35); color: var(--text); font: inherit; outline: none;
  }
  #search:focus { border-color: rgba(255,224,138,.5); }
  .btn {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--panel-border); background: rgba(255,255,255,.05);
    color: var(--text); font: inherit; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.on { border-color: rgba(255,224,138,.55); color: var(--accent); }

  #info { right: 14px; bottom: 14px; width: 300px; padding: 12px 14px; display: none; }
  #info .name { font-size: 15px; font-weight: 650; word-break: break-all; }
  #info .path { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 2px; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #info .actions { display: flex; gap: 6px; }
  #info .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }

  #feed { left: 14px; bottom: 14px; width: 330px; padding: 10px 12px; }
  #feed h2 { margin: 0 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  #feed .empty { color: var(--muted); font-size: 12px; }
  .ev { all: unset; display: flex; gap: 8px; align-items: baseline; padding: 2px 4px; border-radius: 5px; cursor: pointer; width: 100%; box-sizing: border-box; }
  .ev:hover { background: rgba(255,255,255,.07); }
  .ev .k { width: 12px; font-weight: 700; font-family: var(--mono); flex: none; }
  .ev .k.add { color: #63e6be; } .ev .k.del { color: #ff6b6b; } .ev .k.chg { color: #ffd43b; }
  .ev .p { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; }
  .ev .t { color: var(--muted); font-size: 11px; flex: none; }

  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: var(--muted); font-size: 12px;
    background: var(--panel); border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 999px;
    transition: opacity 1s; pointer-events: none; white-space: nowrap;
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }

  .scene-tooltip { font: 12px/1.4 var(--font) !important; }
  .tip { background: rgba(10,12,22,.92); border: 1px solid var(--panel-border); padding: 7px 10px; border-radius: 8px; max-width: 360px; }
  .tip b { font-size: 13px; }
  .tip .tp { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }

  @media (max-width: 760px) {
    #hud { width: calc(100vw - 28px); max-height: 46vh; top: max(14px, env(safe-area-inset-top)); }
    #hudToggle { display: inline-block; }
    #tools { top: auto; bottom: max(14px, env(safe-area-inset-bottom)); right: 14px; left: 14px; max-width: none; justify-content: center; }
    .btn { padding: 8px 10px; }
    #search { flex: 1; min-width: 140px; }
    #feed, #hint { display: none; }
    #info { bottom: 120px; left: 14px; right: 14px; width: auto; }
  }
</style>
</head>
<body>
<div id="graph"></div>
<div id="labels"></div>
<div id="loading" data-i18n="loading">Reading folders…</div>

<section id="hud" class="panel" aria-label="Folder Galaxy">
  <h1><span class="dot-root"></span><span id="rootName">Folder Galaxy</span>
    <span id="live" data-i18n-title="liveTitle"><i></i><span id="liveTxt" data-i18n="connecting">connecting…</span></span>
    <button type="button" id="hudToggle" aria-label="Menu" aria-expanded="true">▾</button></h1>
  <div id="hudBody">
  <form id="pathForm" autocomplete="off">
    <button type="button" class="btn" id="bUp" data-i18n-title="up">↑</button>
    <input id="pathInput" list="dirList" spellcheck="false" autocapitalize="off" data-i18n-placeholder="pathPlaceholder" data-i18n-aria="pathLabel">
    <button class="btn" type="submit" data-i18n="go">Go</button>
  </form>
  <datalist id="dirList"></datalist>
  <div id="crumbs"></div>
  <div id="pathErr"></div>
  <div id="stats">—</div>
  <div id="warn"></div>
  <details open>
    <summary data-i18n="topFolders">Top-level folders</summary>
    <div class="list" id="projList"></div>
  </details>
  <details>
    <summary data-i18n="fileTypes">File types</summary>
    <div class="list" id="legend"></div>
  </details>
  </div>
</section>

<section id="tools" class="panel" aria-label="Tools">
  <input id="search" type="search" data-i18n-placeholder="search" autocomplete="off" spellcheck="false">
  <button class="btn" id="bExpand" data-i18n="expand" data-i18n-title="expandTitle">Expand all</button>
  <button class="btn" id="bCollapse" data-i18n="collapse" data-i18n-title="collapseTitle">Collapse</button>
  <button class="btn" id="bLabels" data-i18n="labels" data-i18n-title="labelsTitle">Labels</button>
  <button class="btn" id="bRotate" data-i18n="rotate" data-i18n-title="rotateTitle">Rotate</button>
  <button class="btn" id="bFit" data-i18n="fit" data-i18n-title="fitTitle">Fit</button>
</section>

<section id="info" class="panel" aria-live="polite">
  <button class="close" id="infoClose" data-i18n-aria="close">×</button>
  <div class="name" id="iName"></div>
  <div class="path" id="iPath"></div>
  <dl id="iDl"></dl>
  <div class="actions">
    <button class="btn" id="iFly" data-i18n="flyHere">Fly here</button>
    <button class="btn" id="iToggle">Open</button>
    <button class="btn" id="iEnter" data-i18n="enter" data-i18n-title="enterTitle">Enter ›</button>
  </div>
</section>

<section id="feed" class="panel" aria-label="Activity">
  <h2 data-i18n="activity">Live activity</h2>
  <div id="feedList"><div class="empty" data-i18n="noActivity">No changes since you opened the page.</div></div>
</section>

<div id="hint"></div>

<script src="3d-force-graph.min.js"></script>
<script>
(() => {
  // ------------------------------------------------------------------ config
  const COLLAPSE_AT = 120;     // folders with more direct children start collapsed
  const INITIAL_LIMIT = 4000;  // above this, only 2 levels are shown at start
  const RECENT_MIN = 20;       // minutes a modified file stays "lit"
  const OLD_DAYS = 60;         // older files look dimmer
  const FLASH_MS = 4000;
  const DYING_MS = 1600;

  // ------------------------------------------------------------------ i18n
  const I18N = {
    en: {
      loading: 'Reading folders…', connecting: 'connecting…', live: 'live', reconnecting: 'reconnecting…',
      liveTitle: 'Real-time connection', up: 'Parent folder', go: 'Go', pathLabel: 'Folder to show',
      pathPlaceholder: '/path/to/folder', topFolders: 'Top-level folders', fileTypes: 'File types',
      search: 'Search files or folders…  ( / )', expand: 'Expand all', expandTitle: 'Open every folder',
      collapse: 'Collapse', collapseTitle: 'Close everything, show the first level only',
      labels: 'Labels', labelsTitle: 'Show the name of every folder', rotate: 'Rotate', rotateTitle: 'Auto-rotate',
      fit: 'Fit', fitTitle: 'Fit everything in view', close: 'Close', flyHere: 'Fly here', open: 'Open',
      enter: 'Enter ›', enterTitle: 'Show only this folder', activity: 'Live activity',
      noActivity: 'No changes since you opened the page.',
      hint: 'Drag to rotate · scroll to zoom · click a folder to open it · pick the folder at the top left',
      hintTouch: 'Drag to rotate · pinch to zoom · tap a folder to open it',
      folder: 'folder', rootFolder: 'root folder', files: 'files', file: 'file',
      collapsedTip: 'collapsed, click to open', modified: 'modified', unreadable: 'unreadable',
      now: 'just now', minAgo: '{n} min ago', hourAgo: '1 hour ago', hoursAgo: '{n} hours ago',
      yesterday: 'yesterday', daysAgo: '{n} days ago', agoNow: 'now', agoMin: '{n} min',
      newItems: '{n} new items', removedItems: '{n} items removed', changedFiles: '{n} files modified',
      stats: '<b>{f}</b> files · <b>{d}</b> folders · <b>{s}</b>', inView: '{n} items in view',
      updated: 'updated {t}', truncated: 'More than {n} items: showing only part of them. Raise MAX_NODES or exclude some folders.',
      noFolders: 'No sub-folders', flyTo: 'Fly to {n}', brighter: 'brighter = modified recently',
      type: 'Type', size: 'Size', lastActivity: 'Last activity', directItems: 'Direct items', note: 'Note',
      unreadableFolder: 'folder not readable', goTo: 'Go to {p}', noService: 'The server is not responding',
      errOutside: 'Only folders inside {b} can be shown', errMissing: 'This folder does not exist',
      errDenied: 'No permission to read this folder',
      cat: { py: 'Python', js: 'JS / TS', web: 'Web', code: 'Other code', sh: 'Scripts', cfg: 'Config', doc: 'Docs', data: 'Data', log: 'Logs', media: 'Media', other: 'Other' },
    },
    it: {
      loading: 'Sto leggendo le cartelle…', connecting: 'connessione…', live: 'live', reconnecting: 'riconnessione…',
      liveTitle: 'Connessione in tempo reale', up: 'Cartella superiore', go: 'Vai', pathLabel: 'Cartella da mostrare',
      pathPlaceholder: '/percorso/della/cartella', topFolders: 'Cartelle principali', fileTypes: 'Tipi di file',
      search: 'Cerca file o cartella…  ( / )', expand: 'Espandi tutto', expandTitle: 'Apri tutte le cartelle',
      collapse: 'Comprimi', collapseTitle: 'Chiudi tutto e mostra solo il primo livello',
      labels: 'Etichette', labelsTitle: 'Mostra il nome di tutte le cartelle', rotate: 'Rotazione', rotateTitle: 'Rotazione automatica',
      fit: 'Centra', fitTitle: 'Inquadra tutto', close: 'Chiudi', flyHere: 'Vola qui', open: 'Apri',
      enter: 'Entra ›', enterTitle: 'Mostra solo questa cartella', activity: 'Attività in tempo reale',
      noActivity: 'Nessuna modifica da quando hai aperto la pagina.',
      hint: 'Trascina per ruotare · rotellina per lo zoom · clic su una cartella per aprirla · in alto a sinistra scegli la cartella',
      hintTouch: 'Trascina per ruotare · pizzica per lo zoom · tocca una cartella per aprirla',
      folder: 'cartella', rootFolder: 'cartella principale', files: 'file', file: 'file',
      collapsedTip: 'chiusa, clic per aprire', modified: 'modificato', unreadable: 'non leggibile',
      now: 'adesso', minAgo: '{n} min fa', hourAgo: '1 ora fa', hoursAgo: '{n} ore fa',
      yesterday: 'ieri', daysAgo: '{n} giorni fa', agoNow: 'ora', agoMin: '{n} min',
      newItems: '{n} elementi nuovi', removedItems: '{n} elementi rimossi', changedFiles: '{n} file modificati',
      stats: '<b>{f}</b> file · <b>{d}</b> cartelle · <b>{s}</b>', inView: 'in vista {n} elementi',
      updated: 'aggiornato alle {t}', truncated: 'Ci sono più di {n} elementi: ne mostro solo una parte. Aumenta MAX_NODES o escludi qualche cartella.',
      noFolders: 'Nessuna sottocartella', flyTo: 'Vola su {n}', brighter: 'più luminoso = modificato da poco',
      type: 'Tipo', size: 'Dimensione', lastActivity: 'Ultima attività', directItems: 'Elementi diretti', note: 'Nota',
      unreadableFolder: 'cartella non leggibile', goTo: 'Vai a {p}', noService: 'Il servizio non risponde',
      errOutside: 'Puoi scegliere solo cartelle dentro {b}', errMissing: 'Questa cartella non esiste',
      errDenied: 'Non ho il permesso di leggere questa cartella',
      cat: { py: 'Python', js: 'JS / TS', web: 'Web', code: 'Altro codice', sh: 'Script', cfg: 'Config', doc: 'Documenti', data: 'Dati', log: 'Log', media: 'Media', other: 'Altro' },
    },
  };
  const urlLang = new URL(location.href).searchParams.get('lang');
  const LANG = I18N[urlLang] ? urlLang : ((navigator.language || 'en').toLowerCase().startsWith('it') ? 'it' : 'en');
  const L = I18N[LANG];
  const t = (key, params = {}) => String(L[key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '');
  document.documentElement.lang = LANG;
  const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

  const PROJECT_COLORS = ['#ff8787','#ffa94d','#ffd43b','#8ce99a','#38d9a9','#4dabf7',
                          '#91a7ff','#da77f2','#f783ac','#c0eb75','#66d9e8','#e599f7','#ffc078','#74c0fc'];
  const CATS = {
    py:    { label: 'Python',     color: '#4dabf7', ext: ['py','pyw','pyi','ipynb'] },
    js:    { label: 'JS / TS',    color: '#ffe066', ext: ['js','mjs','cjs','ts','tsx','jsx'] },
    web:   { label: 'Web',        color: '#ff922b', ext: ['html','htm','css','scss','vue','svelte'] },
    code:  { label: 'Code',       color: '#a9e34b', ext: ['go','rs','c','h','cpp','hpp','cc','java','kt','swift','rb','php','cs','lua','r','scala','dart','zig'] },
    sh:    { label: 'Script',     color: '#69db7c', ext: ['sh','bash','zsh','ps1','bat','service','timer'] },
    cfg:   { label: 'Config',     color: '#b197fc', ext: ['json','yaml','yml','toml','ini','cfg','conf','env','lock','xml','properties'],
             names: ['dockerfile','makefile','requirements.txt','.gitignore','.dockerignore','.env','procfile'] },
    doc:   { label: 'Documenti',  color: '#dee2e6', ext: ['md','txt','rst','pdf','docx','rtf'] },
    data:  { label: 'Dati',       color: '#20c997', ext: ['csv','tsv','parquet','db','sqlite','sqlite3','pkl','pickle','feather','h5','hdf5','jsonl','ndjson','npy','npz','xlsx','xls','arrow','duckdb','rrd'] },
    log:   { label: 'Log',        color: '#ff6b6b', ext: ['log','out','err'] },
    media: { label: 'Media',      color: '#f783ac', ext: ['png','jpg','jpeg','gif','svg','webp','mp4','mov','mkv','mp3','wav','ogg','ttf','otf','woff','woff2','ico'] },
    other: { label: 'Altro',      color: '#868e96', ext: [] },
  };
  for (const [k, c] of Object.entries(CATS)) c.label = L.cat[k];
  const EXT2CAT = {}, NAME2CAT = {};
  for (const [k, c] of Object.entries(CATS)) {
    c.ext.forEach(e => EXT2CAT[e] = k);
    (c.names || []).forEach(n => NAME2CAT[n] = k);
  }
  function catOf(name) {
    const lower = name.toLowerCase();
    if (NAME2CAT[lower]) return NAME2CAT[lower];
    if (lower.startsWith('.env') || lower.startsWith('docker-compose') || lower.startsWith('dockerfile')) return 'cfg';
    if (/\.log(\.\d+)?$/.test(lower)) return 'log';
    const dot = lower.lastIndexOf('.');
    return dot > 0 ? (EXT2CAT[lower.slice(dot + 1)] || 'other') : 'other';
  }

  // ------------------------------------------------------------------ helpers
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LOCALE = LANG === 'it' ? 'it-IT' : undefined;
  const nf = new Intl.NumberFormat(LOCALE);
  function fmtBytes(b) {
    if (!b) return '0 B';
    const u = ['B','KB','MB','GB','TB']; let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return nf.format(b >= 10 || i === 0 ? Math.round(b) : Math.round(b * 10) / 10) + ' ' + u[i];
  }
  function rel(ts) {
    const s = Date.now() / 1000 - ts;
    if (s < 45) return t('now');
    if (s < 3600) return t('minAgo', { n: Math.round(s / 60) });
    if (s < 86400) return Math.round(s / 3600) === 1 ? t('hourAgo') : t('hoursAgo', { n: Math.round(s / 3600) });
    if (s < 172800) return t('yesterday');
    if (s < 86400 * 45) return t('daysAgo', { n: Math.round(s / 86400) });
    return new Date(ts * 1000).toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  const absTime = ts => new Date(ts * 1000).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' });
  const mixCache = new Map();
  function mix(a, b, k) {
    k = Math.round(Math.max(0, Math.min(1, k)) * 12) / 12;
    const key = a + b + k;
    let r = mixCache.get(key);

  function nodeColor(n) {

  const el = $('graph');

  // ------------------------------------------------------------------ data in

    $('stats').textContent = '—';

  async function openRoot(path, push = true) {

    $('bUp').style.opacity = $('bUp').disabled ? .4 : 1;

      let elx;

      else if (insideBase(target)) { elx = document.createElement('button'); elx.onclick = () => openRoot(target); elx.title = t('goTo', { p: target }); }

  $('bUp').onclick = () => openRoot(parentOf(currentPath));
  window.addEventListener('popstate', () => {
    const r = new URL(location.href).searchParams.get('root');
    openRoot(r || defaultPath || '', false);
  });
  // sub-folder suggestions while typing a path
  let dirTimer = null, dirFor = null;
  $('pathInput').addEventListener('input', () => {
    clearTimeout(dirTimer);
    dirTimer = setTimeout(async () => {
      const v = $('pathInput').value;
      const parent = v.endsWith('/') ? (v.replace(/\/+$/, '') || '/') : parentOf(v);
      if (parent === dirFor) return;
      dirFor = parent;
      try {
        const r = await (await fetch('api/dirs?path=' + encodeURIComponent(parent))).json();
        const dl = $('dirList'); dl.textContent = '';
        if (!r.ok) return;
        for (const d of r.dirs) { const o = document.createElement('option'); o.value = joinPath(r.path, d); dl.appendChild(o); }
      } catch (err) { /* nessun suggerimento */ }
    }, 180);
  });
  function setLive(on) {
    $('live').classList.toggle('on', on);
    $('liveTxt').textContent = on ? t('live') : t('reconnecting');
  }

  // ------------------------------------------------------------------ animation loops
  setInterval(() => {
    if (!flashes.size && !visibleNodes.some(n => n.__dying)) return;
    const now = performance.now();
    for (const [id, f] of flashes) if (now - f.t0 > FLASH_MS) flashes.delete(id);
    recolor();
  }, 140);
  setInterval(() => { recolor(); renderStats(); renderFeed(); renderInfo(); }, 30000);

  // HTML labels that follow the nodes
  const labelsEl = $('labels');
  const pool = new Map();
  function labelTargets() {
    const out = new Map();
    const add = (n, cls) => { if (n && visibleSet.has(n.id) && !out.has(n.id)) out.set(n.id, cls); };
    add(all.get(selectedId), 'sel');
    add(all.get(hoverId), 'sel');
    let c = 0;
    for (const id of searchHits) { if (c++ > 40) break; add(all.get(id), 'hit'); }
    add(all.get(''), 'root');
    for (const id of (kids.get('') || [])) { const n = all.get(id); if (n && n.t === 'd') add(n, 'proj'); }
    if (showAllLabels) {
      let k = 0;
      for (const n of visibleNodes) { if (n.t === 'd' && k < 400) { add(n, 'dir'); k++; } }
    }
    return out;
  }
  function labelHtml(n, cls) {
    if (cls === 'root') return esc(rootName);
    if (cls === 'proj') return `${esc(n.n)}<small>${nf.format(n.f || 0)} ${t('files')}</small>`;
    if (n.t === 'd' && collapsed.has(n.id)) return `▸ ${esc(n.n)} <small>(${nf.format(n.f || 0)})</small>`;
    return esc(n.n);
  }
  function drawLabels() {
    const cam = Graph.camera();
    const V = cam.position.constructor;
    const v = new V();
    const w = el.clientWidth, h = el.clientHeight;
    const want = labelTargets();
    for (const [id, div] of pool) if (!want.has(id)) { div.remove(); pool.delete(id); }
    for (const [id, cls] of want) {
      const n = all.get(id);
      let div = pool.get(id);
      if (!div) { div = document.createElement('div'); labelsEl.appendChild(div); pool.set(id, div); }
      const html = labelHtml(n, cls);
      if (div.__html !== html) { div.innerHTML = html; div.__html = html; }
      if (div.className !== 'lbl ' + cls) div.className = 'lbl ' + cls;
      if (n.x === undefined) { div.style.display = 'none'; continue; }
      v.set(n.x, n.y, n.z);
      const dist = cam.position.distanceTo(v);
      v.project(cam);
      if (v.z > 1 || v.z < -1) { div.style.display = 'none'; continue; }
      const x = (v.x + 1) / 2 * w, y = (1 - v.y) / 2 * h;
      const r = Math.cbrt(nodeVal(n)) * 3;
      const off = Math.min(40, r * 600 / Math.max(dist, 1)) + 6;
      div.style.display = '';
      div.style.transform = `translate(${x}px, ${y - off}px) translate(-50%, -100%)`;
      div.style.opacity = cls === 'dir' ? Math.max(0, Math.min(1, 1.4 - dist / 900)) : 1;
    }
    requestAnimationFrame(drawLabels);
  }
  requestAnimationFrame(drawLabels);

  // ------------------------------------------------------------------ UI
  function renderStats() {
    const root = all.get('');
    if (!root) return;
    let dirs = 0; for (const n of all.values()) if (n.t === 'd') dirs++;
    $('stats').innerHTML =
      t('stats', { f: nf.format(root.f || 0), d: nf.format(Math.max(0, dirs - 1)), s: fmtBytes(root.s) }) + '<br>' +
      t('inView', { n: nf.format(visibleNodes.length) }) +
      (lastUpdate ? ' · ' + t('updated', { t: lastUpdate.toLocaleTimeString(LOCALE) }) : '');
    const w = $('warn');
    if (truncated) { w.style.display = 'block'; w.textContent = t('truncated', { n: nf.format(maxNodes) }); }
    else w.style.display = 'none';
  }
  let projSig = '';
  function renderProjects() {
    const list = [...(kids.get('') || [])].map(id => all.get(id)).filter(n => n && n.t === 'd')
      .sort((a, b) => a.n.localeCompare(b.n));
    const sig = list.map(n => n.id + ':' + n.f).join('|');
    if (sig === projSig) return;
    projSig = sig;
    const box = $('projList');
    box.textContent = '';
    if (!list.length) { box.innerHTML = `<div class="row" style="color:var(--muted)">${esc(t('noFolders'))}</div>`; return; }
    for (const n of list) {
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = `<span class="sw" style="background:${projColor(n.proj)}"></span><span class="nm"></span><span class="ct">${nf.format(n.f || 0)}</span>`;
      b.querySelector('.nm').textContent = n.n;
      b.title = t('flyTo', { n: n.n });
      b.onclick = () => { select(n.id); flyTo(n); };
      box.appendChild(b);
    }
  }
  function renderLegend() {
    const box = $('legend');
    for (const c of Object.values(CATS)) {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span class="sw" style="background:${c.color}"></span><span class="nm">${c.label}</span>`;
      box.appendChild(r);
    }
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span class="sw" style="background:#fff;box-shadow:0 0 6px #fff"></span><span class="nm">${esc(t('brighter'))}</span>`;
    box.appendChild(r);
  }
  function renderFeed() {
    const box = $('feedList');
    if (!feed.length) return;
    box.textContent = '';
    for (const e of feed) {
      const b = document.createElement('button');
      b.className = 'ev';
      const sym = e.k === 'add' ? '+' : e.k === 'del' ? '−' : '~';
      const ago = Math.round((Date.now() - e.t) / 1000);
      const when = ago < 60 ? t('agoNow') : t('agoMin', { n: Math.round(ago / 60) });
      b.innerHTML = `<span class="k ${e.k}">${sym}</span><span class="p"></span><span class="t">${when}</span>`;
      b.querySelector('.p').textContent = e.txt || ('‎' + e.id);
      if (e.id && e.k !== 'del') b.onclick = () => reveal(e.id);
      else b.style.cursor = 'default';
      box.appendChild(b);
    }
  }
  function select(id) {
    selectedId = id;
    recolor();
    renderInfo();
  }
  function renderInfo() {
    const n = selectedId !== null ? all.get(selectedId) : null;
    const box = $('info');
    if (!n) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    $('iName').textContent = n.n;
    $('iPath').textContent = fullPath(n);
    const rows = n.t === 'd'
      ? [[t('type'), n.id === '' ? t('rootFolder') : t('folder')], [t('files').replace(/^./, c => c.toUpperCase()), nf.format(n.f || 0)],
         [t('directItems'), nf.format((kids.get(n.id) || new Set()).size)], [t('size'), fmtBytes(n.s)],
         [t('lastActivity'), rel(n.m)], ['', absTime(n.m)]]
      : [[t('type'), CATS[n.cat].label], [t('size'), fmtBytes(n.s)], [t('modified').replace(/^./, c => c.toUpperCase()), rel(n.m)], ['', absTime(n.m)]];
    if (n.e) rows.push([t('note'), t('unreadableFolder')]);
    $('iDl').innerHTML = rows.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
    const tg = $('iToggle');
    if (n.t === 'd' && n.id !== '') { tg.style.display = ''; tg.textContent = collapsed.has(n.id) ? t('open') : t('close'); }
    else tg.style.display = 'none';
    $('iEnter').style.display = n.t === 'd' && n.id !== '' ? '' : 'none';
  }
  $('infoClose').onclick = () => select(null);
  $('iFly').onclick = () => flyTo(all.get(selectedId));
  $('iToggle').onclick = () => { if (selectedId) toggle(selectedId); };
  $('iEnter').onclick = () => { const n = all.get(selectedId); if (n) openRoot(fullPath(n)); };

  $('bExpand').onclick = () => {
    for (const id of collapsed) userOpened.add(id);
    for (const [id] of kids) userOpened.add(id);
    collapsed.clear();
    refresh({ pin: true });
    renderInfo();
  };
  $('bCollapse').onclick = () => {
    userOpened.clear();
    for (const n of all.values()) if (n.t === 'd' && n.depth >= 1) collapsed.add(n.id);
    refresh({ pin: true });
    renderInfo();
    setTimeout(() => Graph.zoomToFit(1000, 60), 600);
  };
  $('bLabels').onclick = e => { showAllLabels = !showAllLabels; e.currentTarget.classList.toggle('on', showAllLabels); };
  $('bRotate').onclick = e => {
    const c = Graph.controls();
    c.autoRotate = !c.autoRotate; c.autoRotateSpeed = 0.6;
    e.currentTarget.classList.toggle('on', c.autoRotate);
  };
  $('bFit').onclick = () => Graph.zoomToFit(1000, 60);

  const search = $('search');
  search.addEventListener('input', () => {
    searchQ = search.value.trim().toLowerCase();
    searchHits = new Set();
    if (searchQ) for (const n of all.values()) if (n.n.toLowerCase().includes(searchQ)) searchHits.add(n.id);
    recolor();
  });
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = [...searchHits].map(id => all.get(id)).sort((a, b) => a.depth - b.depth)[0];
      if (first) reveal(first.id);
    } else if (e.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); search.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
    else if (e.key === 'Escape' && document.activeElement !== search) select(null);
  });
  window.addEventListener('resize', () => Graph.width(window.innerWidth).height(window.innerHeight));
  setTimeout(() => { $('hint').style.opacity = 0; }, 12000);

  // static texts
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(e => { e.placeholder = t(e.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
  $('hint').textContent = IS_TOUCH ? t('hintTouch') : t('hint');
  // on small screens the summary panel starts folded and can be toggled
  function setHud(open) {
    $('hudBody').style.display = open ? '' : 'none';
    $('hudToggle').textContent = open ? '▾' : '▸';
    $('hudToggle').setAttribute('aria-expanded', open);
  }
  $('hudToggle').onclick = () => setHud($('hudBody').style.display === 'none');
  if (window.innerWidth < 760) { setHud(false); document.querySelectorAll('#hud details').forEach(d => d.open = false); }
  window.__fg = { Graph, all, visible: () => visibleSet };  // handy for debugging from the console
  renderLegend();
  openRoot(new URL(location.href).searchParams.get('root') || '', false);
})();
</script>
</body>
</html>
